<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captionly</title>
<meta name="description" content="Captionly: automatic captions for Reels and Shorts in English, Urdu, Hindi, Hinglish and Roman Urdu, made offline on your phone.">
<style>
  :root { --bg: #0f0f14; --fg: #ececf1; --muted: #a9a9b8; --accent: #facc15; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 16px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { font-size: 40px; margin: 20px 0 4px; }
  p { color: var(--muted); }
  ul { text-align: left; display: inline-block; color: var(--fg); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Captionly icon">
  <h1>Captionly</h1>
  <p>Automatic captions for your videos, made on your phone. Private and offline.</p>
  <ul>
    <li>English, Urdu, Hindi, Hinglish and Roman Urdu</li>
    <li>Word-by-word styles: Karaoke, Bubble, Pop, Neon and more</li>
    <li>Place captions anywhere, fix any word, export MP4 or SRT</li>
  </ul>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
